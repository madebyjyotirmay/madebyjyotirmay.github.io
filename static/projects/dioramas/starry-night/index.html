<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Van Gogh's Starry Night</title>
<style>
  html,body{margin:0;height:100%;background:#0f2148;overflow:hidden;font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;outline:none}
  #tools{position:absolute;top:12px;right:12px;display:flex;gap:2px;align-items:center;background:rgba(12,24,56,.72);padding:4px;border-radius:999px;box-shadow:0 2px 14px rgba(0,0,0,.3)}
  #tools button{border:0;background:transparent;font:13px/1 system-ui,-apple-system,sans-serif;color:#f1e7c2;padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  #tools button:hover{background:rgba(255,226,130,.16)}
  #tools #del{display:none;color:#ffb48c}
  #title{position:absolute;left:16px;top:14px;color:#f3e2a0;font-style:italic;font-size:16px;letter-spacing:.2px;pointer-events:none;opacity:.92;text-shadow:0 1px 6px rgba(0,0,20,.6)}
  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);color:#f1e7c2;font:13px/1.35 system-ui,-apple-system,sans-serif;background:rgba(12,24,56,.72);padding:7px 14px;border-radius:16px;pointer-events:none;transition:opacity .8s;text-align:center;max-width:calc(100% - 32px);box-sizing:border-box}
  #toast{position:absolute;left:50%;top:58px;transform:translateX(-50%) translateY(-6px);color:#1b2850;font:14px/1.3 system-ui,-apple-system,sans-serif;background:rgba(244,210,96,.94);padding:8px 16px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  html.embed #title{display:none}
  #play{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:18px;background:transparent;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #play span{font:600 14px/1 system-ui,-apple-system,sans-serif;color:#1b2850;background:rgba(244,210,96,.94);padding:10px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  html.gated #play{display:flex}
  html.gated #hint{display:none}
  @media (max-width:520px){#title{font-size:14px;top:58px;left:50%;transform:translateX(-50%);white-space:nowrap}#toast{top:96px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="A little village under Van Gogh's starry night. Draw a circle on open ground to summon a little Vincent; tap the sky to stir the stars."></canvas>
<div id="title">La Nuit étoilée, Saint-Rémy</div>
<div id="tools">
  <button id="rl" title="Rotate left 45°">↺ 45°</button>
  <button id="rs" title="Reset view">Reset</button>
  <button id="rr" title="Rotate right 45°">45° ↻</button>
  <button id="del" title="Remove selected Vincent">Remove</button>
</div>
<div id="hint">Draw a circle on the ground to summon Vincent · tap the sky to stir the stars · tap a house to switch its lights</div>
<div id="toast"></div>
<button id="play" aria-label="Tap to play with the starry night"><span>Tap to play</span></button>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- utils
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(18890);
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hexC = {};
function h2r(h) { if (hexC[h]) return hexC[h]; const s = h.replace('#', ''); return (hexC[h] = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]); }
const rgbs = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function shade(h, amt) { const c = h2r(h); return rgbs(amt >= 0 ? c.map(v => v + (255 - v) * amt) : c.map(v => v * (1 + amt))); }
const hexA = (h, a) => rgbs(h2r(h), a);
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const EMBED = /(^|[?&])embed\b/.test(location.search);
const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;
const CALM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let gated = EMBED && COARSE, awake = !CALM, visible = true;
if (EMBED) document.documentElement.classList.add('embed');
if (gated) { document.documentElement.classList.add('gated'); document.getElementById('c').style.touchAction = 'pan-y'; }
const FILTER_OK = (() => { try { const c = mk(2, 2).getContext('2d'); c.filter = 'blur(1px)'; return c.filter === 'blur(1px)'; } catch (e) { return false; } })();

// spheres lit from the moon (upper right)
function sph(g, x, y, r, col, hl = 0.38, dk = 0.3) {
  const gr = g.createRadialGradient(x + r * 0.34, y - r * 0.42, r * 0.06, x, y, r * 1.04);
  gr.addColorStop(0, shade(col, hl)); gr.addColorStop(0.5, col); gr.addColorStop(1, shade(col, -dk));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
}
function ell(g, x, y, rx, ry, col, hl, dk, rot = 0) { g.save(); g.translate(x, y); if (rot) g.rotate(rot); g.scale(1, ry / rx); sph(g, 0, 0, rx, col, hl, dk); g.restore(); }
function bumpy(g, cx, cy, rx, ry, n, cols, r0, r1, R) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = R() * 6.2832, d = Math.sqrt(R());
    const x = cx + Math.cos(a) * d * rx, y = cy + Math.sin(a) * d * ry;
    const s = ((cx - x) / rx + (y - cy) / ry) * 0.5;
    const idx = clamp(Math.floor((s * 0.5 + 0.5) * cols.length + (R() - 0.5) * 1.6), 0, cols.length - 1);
    pts.push([x, y, lerp(r0, r1, R()), cols[idx]]);
  }
  pts.sort((a, b) => a[1] - b[1]);
  for (const p of pts) sph(g, p[0], p[1], p[2], p[3], 0.3, 0.22);
}
// a short curved brush stroke, the signature of the whole piece
function dash(g, x, y, len, ang, bend) { const c = Math.cos(ang), s = Math.sin(ang); g.moveTo(x - c * len / 2, y - s * len / 2); g.quadraticCurveTo(x - s * bend, y + c * bend, x + c * len / 2, y + s * len / 2); }
function star(g, x, y, r, rot) { g.save(); g.translate(x, y); g.rotate(rot); g.beginPath(); for (let i = 0; i < 8; i++) { const rad = i % 2 ? r * 0.42 : r, a = i * Math.PI / 4; g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); } g.closePath(); g.fill(); g.restore(); }

// ---------------------------------------------------------------- village layout (u,v in [0,1], v=0 back, v=1 front)
const CR = 0.1;
function rrSDF(u, v) {
  const qx = Math.abs(u - 0.5) - (0.5 - CR), qy = Math.abs(v - 0.5) - (0.5 - CR);
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - CR;
}
const PATHS = [
  { pts: [[0.5, 0.995], [0.485, 0.84], [0.53, 0.66], [0.56, 0.5]], w: 0.042 },
  { pts: [[0.23, 0.44], [0.33, 0.43], [0.45, 0.475], [0.56, 0.5], [0.7, 0.475], [0.82, 0.5], [0.94, 0.47]], w: 0.03 },
  { pts: [[0.56, 0.5], [0.6, 0.4]], w: 0.03 },
];
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; const t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1); return Math.hypot(px - ax - dx * t, py - ay - dy * t); }
function pathSDF(u, v) { let m = 9; for (const p of PATHS) for (let i = 0; i < p.pts.length - 1; i++) { const a = p.pts[i], b = p.pts[i + 1]; m = Math.min(m, segDist(u, v, a[0], a[1], b[0], b[1]) - p.w / 2); } return m; }
const FIELDS = [
  { u0: 0.6, u1: 0.95, v0: 0.7, v1: 0.93, pal: 0, ang: 0.35 },
  { u0: 0.06, u1: 0.3, v0: 0.11, v1: 0.27, pal: 1, ang: -0.25 },
  { u0: 0.05, u1: 0.2, v0: 0.38, v1: 0.6, pal: 2, ang: 1.25 },
];
function fieldSDF(b, u, v) { const r = 0.02, cx = (b.u0 + b.u1) / 2, cy = (b.v0 + b.v1) / 2; const qx = Math.abs(u - cx) - ((b.u1 - b.u0) / 2 - r), qy = Math.abs(v - cy) - ((b.v1 - b.v0) / 2 - r); return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; }
// rolling blue hills along the back edge, built in 3D so they hold up from every side
const HILLS = [{ c: 0.21, w: 0.16, h: 0.13 }, { c: 0.5, w: 0.15, h: 0.17 }, { c: 0.79, w: 0.15, h: 0.12 }];
const HV0 = 0.13, HV1 = 0.055, HVB = 0.015, HN = 18;
const hillP = (u, b) => { const x = (u - b.c) / b.w; return x * x >= 1 ? 0 : 1 - x * x; };
function hillH(u, b) { const p = hillP(u, b); return b.h * Math.pow(p, 1.3) * (1 + 0.07 * Math.sin(u * 47 + b.c * 9)); }
// zones: 0 out, 1 meadow, 2 lane, 3 field
function zoneAt(u, v) { if (rrSDF(u, v) > 0) return 0; if (pathSDF(u, v) < 0) return 2; for (const b of FIELDS) if (fieldSDF(b, u, v) < 0) return 3; return 1; }
// the rolling, swirling direction of the ground strokes
const flowA = (u, v) => 0.85 * Math.sin(u * 7.5 + v * 3.1) + 0.6 * Math.cos(v * 8.5 - u * 4.2) + 0.25 * Math.sin((u + v) * 17);

// ---------------------------------------------------------------- sprite art (units: 1 = 1/1000 of the platform width; origin = ground contact)
const INK = 'rgba(14,20,48,.82)';
const WIN_ON = ['#f7d24a', '#ffe58a', '#f2b53a'], WIN_OFF = ['#26365e', '#2d3f6a', '#1f2c50'];
const ART = {
  cypress(g, R, o) {
    const H = o.h || 230, Wd = o.w || 30;
    const wAt = t => Wd * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.08 + 0.06)), 0.62) * (1 - 0.72 * t) + 3;
    const cxAt = t => Math.sin(t * 6.5 + 0.4) * 5 * t + Math.sin(t * 15) * 1.6;
    // body silhouette
    g.fillStyle = '#16281f'; g.beginPath();
    for (let i = 0; i <= 40; i++) { const t = i / 40; g.lineTo(cxAt(t) - wAt(t), -t * H); }
    for (let i = 40; i >= 0; i--) { const t = i / 40; g.lineTo(cxAt(t) + wAt(t), -t * H); }
    g.closePath(); g.fill();
    g.fillStyle = '#4a3322'; g.fillRect(-4, -8, 8, 9);
    // flame strokes curling upward
    const cols = ['#1d3a2a', '#27492f', '#33593a', '#456d3c', '#5f8340', '#7f8a3c', '#8b6a2e', '#1a2b45', '#2c4560'];
    g.lineCap = 'round';
    for (let i = 0; i < 300; i++) {
      const t0 = R() * 0.94, side = R() * 2 - 1, len = 0.05 + R() * 0.11;
      const pts = [];
      for (let k = 0; k <= 6; k++) { const t = Math.min(1, t0 + len * k / 6), sd = side * (1 - k / 6 * 0.35) + Math.sin(k * 0.9 + i) * 0.12; pts.push([cxAt(t) + sd * wAt(t), -t * H]); }
      const lit = side > 0.2 ? 2 : side < -0.4 ? -2 : 0;
      g.strokeStyle = cols[clamp(Math.floor(R() * 5 + lit + (t0 > 0.7 ? 1 : 0)), 0, cols.length - 1)];
      if (R() < 0.12) g.strokeStyle = cols[7 + (R() * 2 | 0)];
      g.lineWidth = 2.6 + R() * 2.2; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let k = 1; k < pts.length - 1; k++) g.quadraticCurveTo(pts[k][0], pts[k][1], (pts[k][0] + pts[k + 1][0]) / 2, (pts[k][1] + pts[k + 1][1]) / 2);
      g.stroke();
    }
    // moonlit edge
    g.strokeStyle = 'rgba(190,210,150,.35)'; g.lineWidth = 1.6; g.beginPath();
    for (let i = 4; i <= 38; i++) { const t = i / 40; g.lineTo(cxAt(t) + wAt(t) - 1.5, -t * H); } g.stroke();
  },
  church(g, R) {
    const x0 = -46, x1 = 24, fh = 40, bx = 24, by = -12;
    // nave side + front
    g.fillStyle = '#7f8fa8'; poly(g, [[x1, 0], [x1 + bx, by], [x1 + bx, by - fh], [x1, -fh]]); g.fill();
    let gr = g.createLinearGradient(x0, -fh, x1, 0); gr.addColorStop(0, '#b6c3d2'); gr.addColorStop(1, '#d5dde4');
    g.fillStyle = gr; g.fillRect(x0, -fh, x1 - x0, fh);
    // roof
    const rh = 22;
    g.fillStyle = '#1f3260'; poly(g, [[x0 - 3, -fh], [x1 + 3, -fh], [x1 + bx + 3, by - fh], [x0 + bx - 3, by - fh]]); g.fill();
    g.fillStyle = '#2b4580'; poly(g, [[x0 - 3, -fh], [x1 + 3, -fh], [x1 + bx / 2 + 3, by / 2 - fh - rh], [x0 + bx / 2 - 3, by / 2 - fh - rh]]); g.fill();
    g.fillStyle = '#9cabbf'; poly(g, [[x1, -fh], [x1 + bx, by - fh], [x1 + bx / 2, by / 2 - fh - rh]]); g.fill();
    g.strokeStyle = '#3a5594'; g.lineWidth = 1; for (let i = 1; i < 5; i++) { const t = i / 5; g.beginPath(); g.moveTo(lerp(x0 - 3, x0 + bx / 2 - 3, t), lerp(-fh, by / 2 - fh - rh, t)); g.lineTo(lerp(x1 + 3, x1 + bx / 2 + 3, t), lerp(-fh, by / 2 - fh - rh, t)); g.stroke(); }
    // windows (warm) + door
    for (const wx of [-30, -6, 12]) { g.fillStyle = '#f2c84a'; g.beginPath(); g.moveTo(wx - 3, -12); g.lineTo(wx - 3, -24); g.arc(wx, -24, 3, Math.PI, 0); g.lineTo(wx + 3, -12); g.fill(); g.fillStyle = '#fff1a6'; g.fillRect(wx - 1, -22, 2, 7); }
    g.fillStyle = '#3d2b25'; g.beginPath(); g.moveTo(x1 + 8, -2); g.lineTo(x1 + 8, -16); g.lineTo(x1 + 15, -18.5); g.lineTo(x1 + 15, -5); g.fill();
    // bell tower + spire (the painting's needle)
    const tx0 = -40, tx1 = -24, th = 92;
    g.fillStyle = '#c3cfdc'; g.fillRect(tx0, -th, tx1 - tx0, th - fh + 2);
    g.fillStyle = '#8796ae'; poly(g, [[tx1, -fh], [tx1 + 8, -fh - 4], [tx1 + 8, -th - 4], [tx1, -th]]); g.fill();
    g.fillStyle = '#f2c84a'; g.fillRect(tx0 + 5, -th + 12, 6, 10);
    g.fillStyle = '#1c2a52'; g.fillRect(tx0 + 5.5, -th + 13, 5, 3);
    gr = g.createLinearGradient(tx0, 0, tx1 + 8, 0); gr.addColorStop(0, '#3a5aa0'); gr.addColorStop(1, '#1a2a58');
    g.fillStyle = gr; poly(g, [[tx0 - 2, -th], [tx1 + 2, -th], [tx1 + 9, -th - 4], [(tx0 + tx1) / 2 + 3, -th - 70]]); g.fill();
    g.strokeStyle = 'rgba(140,170,230,.6)'; g.lineWidth = 1; g.beginPath(); g.moveTo(tx0 + 1, -th - 1); g.lineTo((tx0 + tx1) / 2 + 3, -th - 68); g.stroke();
    // ink outlines, Van Gogh style
    g.strokeStyle = INK; g.lineWidth = 1.8; g.lineJoin = 'round';
    g.strokeRect(x0, -fh, x1 - x0, fh); g.strokeRect(tx0, -th, tx1 - tx0, th - fh);
    poly(g, [[tx0 - 2, -th], [tx1 + 2, -th], [tx1 + 9, -th - 4], [(tx0 + tx1) / 2 + 3, -th - 70]]); g.stroke();
    poly(g, [[x0 - 3, -fh], [x1 + 3, -fh], [x1 + bx / 2 + 3, by / 2 - fh - rh], [x0 + bx / 2 - 3, by / 2 - fh - rh]]); g.stroke();
    poly(g, [[x1, 0], [x1 + bx, by], [x1 + bx, by - fh], [x1, -fh]]); g.stroke();
    shrubs(g, R, x0 - 4, x1 + bx, by);
  },
  house(g, R, o) {
    const v = o.v || 0, wide = [44, 36, 50, 40][v % 4], fh = [24, 28, 22, 30][v % 4], bx = 16, by = -9;
    const x0 = -wide / 2 - 6, x1 = x0 + wide;
    const wall = ['#c9cfc2', '#d5c28c', '#a9bccd', '#d8c7a0'][v % 4], roof = ['#2b4580', '#6b4a3a', '#2f5a6a', '#3a3f72'][v % 4];
    g.fillStyle = shade(wall, -0.3); poly(g, [[x1, 0], [x1 + bx, by], [x1 + bx, by - fh], [x1, -fh]]); g.fill();
    g.fillStyle = shade(wall, -0.3); poly(g, [[x1, -fh], [x1 + bx, by - fh], [x1 + bx / 2, by / 2 - fh - 13]]); g.fill();
    const gr = g.createLinearGradient(x0, -fh, x1, 0); gr.addColorStop(0, shade(wall, -0.1)); gr.addColorStop(1, wall);
    g.fillStyle = gr; g.fillRect(x0, -fh, wide, fh);
    // roof slab
    const rp = [[x0 - 3, -fh + 1], [x1 + 2, -fh + 1], [x1 + bx / 2 + 1, by / 2 - fh - 13], [x0 + bx / 2 - 4, by / 2 - fh - 13]];
    g.fillStyle = roof; poly(g, rp); g.fill();
    g.strokeStyle = shade(roof, 0.25); g.lineWidth = 1.2; g.beginPath(); for (let i = 0; i < 9; i++) dash(g, lerp(x0, x1, R()), -fh - 2 - R() * 10, 5 + R() * 4, -0.1 + R() * 0.2, 1); g.stroke();
    // chimney
    if (v % 2 === 0) { g.fillStyle = shade(wall, -0.2); g.fillRect(x0 + 8, by / 2 - fh - 16, 5, 10); g.strokeStyle = INK; g.lineWidth = 1.2; g.strokeRect(x0 + 8, by / 2 - fh - 16, 5, 10); }
    // windows
    const lit = !!o.lit, nW = wide > 42 ? 3 : 2;
    for (let i = 0; i < nW; i++) {
      const cx = x0 + wide * (i + 0.5) / nW, top = -fh + 6, hh = Math.min(9, fh - 12);
      if (i === 1 && nW === 3) { g.fillStyle = '#4a3326'; g.fillRect(cx - 3.5, -13, 7, 13); continue; }
      g.fillStyle = (lit ? WIN_ON : WIN_OFF)[i % 3]; g.fillRect(cx - 3.5, top, 7, hh);
      if (lit) { g.fillStyle = '#fff3b8'; g.fillRect(cx - 1.5, top + 1.5, 3, hh - 3); }
      g.strokeStyle = INK; g.lineWidth = 1; g.strokeRect(cx - 3.5, top, 7, hh);
    }
    g.fillStyle = lit ? '#f2b53a' : '#26365e'; poly(g, [[x1 + 5, -fh + 7], [x1 + 10, -fh + 4.5], [x1 + 10, -fh + 12], [x1 + 5, -fh + 14.5]]); g.fill();
    if (nW === 2) { g.fillStyle = '#4a3326'; poly(g, [[x1 + 3, -1], [x1 + 3, -11], [x1 + 7, -13], [x1 + 7, -3]]); g.fill(); }
    // brushy wall strokes + ink outline
    g.strokeStyle = hexA('#ffffff', 0.12); g.lineWidth = 1.3; g.beginPath(); for (let i = 0; i < 10; i++) dash(g, lerp(x0 + 2, x1 - 2, R()), -R() * fh, 4 + R() * 3, (R() - 0.5) * 0.6, 0.8); g.stroke();
    g.strokeStyle = INK; g.lineWidth = 1.6; g.lineJoin = 'round';
    g.strokeRect(x0, -fh, wide, fh); poly(g, rp); g.stroke(); poly(g, [[x1, 0], [x1 + bx, by], [x1 + bx, by - fh]]); g.stroke();
    shrubs(g, R, x0, x1 + bx, by);
  },
  olive(g, R) {
    g.strokeStyle = '#3d2c22'; g.lineCap = 'round'; g.lineWidth = 5; g.beginPath(); g.moveTo(-2, 0); g.quadraticCurveTo(-6, -12, 1, -22); g.stroke();
