<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monet's Garden at Giverny</title>
<style>
  html,body{margin:0;height:100%;background:#f6efe2;overflow:hidden;font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;outline:none}
  #tools{position:absolute;top:12px;right:12px;display:flex;gap:2px;align-items:center;background:rgba(255,253,248,.88);padding:4px;border-radius:999px;box-shadow:0 2px 12px rgba(90,70,40,.13)}
  #tools button{border:0;background:transparent;font:13px/1 system-ui,-apple-system,sans-serif;color:#5d4c3a;padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  #tools button:hover{background:#f1e6d3}
  #tools #del{display:none;color:#b24a3c}
  #title{position:absolute;left:16px;top:14px;color:#6f5c45;font-style:italic;font-size:16px;letter-spacing:.2px;pointer-events:none;opacity:.9}
  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);color:#7a6650;font:13px/1.35 system-ui,-apple-system,sans-serif;background:rgba(255,253,248,.82);padding:7px 14px;border-radius:16px;pointer-events:none;transition:opacity .8s;text-align:center;max-width:calc(100% - 32px);box-sizing:border-box}
  #toast{position:absolute;left:50%;top:58px;transform:translateX(-50%) translateY(-6px);color:#fff;font:14px/1.3 system-ui,-apple-system,sans-serif;background:rgba(92,72,52,.88);padding:8px 16px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  html.embed #title{display:none}
  #play{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:18px;background:transparent;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #play span{font:600 14px/1 system-ui,-apple-system,sans-serif;color:#fff;background:rgba(92,72,52,.85);padding:10px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(60,40,20,.2)}
  html.gated #play{display:flex}
  html.gated #hint{display:none}
  @media (max-width:520px){#title{font-size:14px;top:58px;left:50%;transform:translateX(-50%);white-space:nowrap}#toast{top:96px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Monet's garden at Giverny. Draw a circle on open ground to summon a little Monet."></canvas>
<div id="title">Le jardin de Monet, Giverny</div>
<div id="tools">
  <button id="rl" title="Rotate left 45°">↺ 45°</button>
  <button id="rs" title="Reset view">Reset</button>
  <button id="rr" title="Rotate right 45°">45° ↻</button>
  <button id="del" title="Remove selected Monet">Remove</button>
</div>
<div id="hint">Draw a circle on the grass to summon Monet · drag him around · drag outside the garden to rotate</div>
<div id="toast"></div>
<button id="play" aria-label="Tap to play with the garden"><span>Tap to play</span></button>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- utils
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(20260);
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hexC = {};
function h2r(h) { if (hexC[h]) return hexC[h]; const s = h.replace('#', ''); return (hexC[h] = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]); }
const rgbs = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function shade(h, amt) { const c = h2r(h); return rgbs(amt >= 0 ? c.map(v => v + (255 - v) * amt) : c.map(v => v * (1 + amt))); }
const hexA = (h, a) => rgbs(h2r(h), a);
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const EMBED = /(^|[?&])embed\b/.test(location.search);
const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;
const CALM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let gated = EMBED && COARSE, awake = !CALM, visible = true;
if (EMBED) document.documentElement.classList.add('embed');
// inside the blog, follow the blog's light/dark theme
const parentDark = () => { try { if (window.parent === window) return false; const t = window.parent.document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; } };
let DARK = EMBED && parentDark(), parentBgCache = null;
function parentBg() {
  if (!EMBED) return null;
  try {
    const d = window.parent.document, cs = e => getComputedStyle(e).backgroundColor, clear = c => !c || c === 'transparent' || /rgba\(.*,\s*0\)$/.test(c);
    let c = cs(d.body); if (clear(c)) c = cs(d.documentElement);
    return clear(c) ? null : c;
  } catch (e) { return null; }
}
if (EMBED) try { new MutationObserver(() => { DARK = parentDark(); requestAnimationFrame(() => { renderBg(); setTimeout(renderBg, 350); }); }).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { DARK = parentDark(); requestAnimationFrame(renderBg); }); } catch (e) { }
if (gated) { document.documentElement.classList.add('gated'); document.getElementById('c').style.touchAction = 'pan-y'; }
const FILTER_OK = (() => { try { const c = mk(2, 2).getContext('2d'); c.filter = 'blur(1px)'; return c.filter === 'blur(1px)'; } catch (e) { return false; } })();

// spheres lit from upper-left
function sph(g, x, y, r, col, hl = 0.38, dk = 0.3) {
  const gr = g.createRadialGradient(x - r * 0.38, y - r * 0.42, r * 0.06, x, y, r * 1.04);
  gr.addColorStop(0, shade(col, hl)); gr.addColorStop(0.5, col); gr.addColorStop(1, shade(col, -dk));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
}
function ell(g, x, y, rx, ry, col, hl, dk, rot = 0) { g.save(); g.translate(x, y); if (rot) g.rotate(rot); g.scale(1, ry / rx); sph(g, 0, 0, rx, col, hl, dk); g.restore(); }
function bumpy(g, cx, cy, rx, ry, n, cols, r0, r1, R) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = R() * 6.2832, d = Math.sqrt(R());
    const x = cx + Math.cos(a) * d * rx, y = cy + Math.sin(a) * d * ry;
    const s = ((x - cx) / rx + (y - cy) / ry) * 0.5;
    const idx = clamp(Math.floor((s * 0.5 + 0.5) * cols.length + (R() - 0.5) * 1.6), 0, cols.length - 1);
    pts.push([x, y, lerp(r0, r1, R()), cols[idx]]);
  }
  pts.sort((a, b) => a[1] - b[1]);
  for (const p of pts) sph(g, p[0], p[1], p[2], p[3], 0.32, 0.22);
}
function leaf(g, x, y, len, wid, ang, col) {
  g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = col;
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * 0.5, -wid, len, 0); g.quadraticCurveTo(len * 0.5, wid, 0, 0); g.fill(); g.restore();
}

// ---------------------------------------------------------------- garden layout (u,v in [0,1], v=0 back, v=1 front)
const CR = 0.1;
function rrSDF(u, v) {
  const qx = Math.abs(u - 0.5) - (0.5 - CR), qy = Math.abs(v - 0.5) - (0.5 - CR);
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - CR;
}
const PC = { u: 0.69, v: 0.37, rx: 0.19, ry: 0.15 };
const pondR = a => 1 + 0.07 * Math.sin(3 * a + 1) + 0.04 * Math.sin(5 * a + 2.2) + 0.03 * Math.sin(2 * a + 0.5);
function pondSDF(u, v) { const dx = (u - PC.u) / PC.rx, dy = (v - PC.v) / PC.ry; return Math.hypot(dx, dy) / pondR(Math.atan2(dy, dx)) - 1; }
const isWater = (u, v) => pondSDF(u, v) < 0;
function pondPt(a, s) { const r = pondR(a) * s; return [PC.u + Math.cos(a) * PC.rx * r, PC.v + Math.sin(a) * PC.ry * r]; }

const BR = { u: 0.55, hw: 0.026, v0: 0, v1: 0, H: 0.085, RH: 0.05, N: 12 };
(() => { let w0 = -1, w1 = -1; for (let v = 0.05; v < 0.75; v += 0.002) if (isWater(BR.u, v)) { if (w0 < 0) w0 = v; w1 = v; } BR.v0 = w0 - 0.032; BR.v1 = w1 + 0.032; })();
const onBridge = (u, v) => Math.abs(u - BR.u) < BR.hw * 0.8 && v > BR.v0 && v < BR.v1;
function bridgeHt(v) { const t = (v - BR.v0) / (BR.v1 - BR.v0); return t <= 0 || t >= 1 ? 0 : BR.H * Math.sin(Math.PI * t); }

const PATHS = [
  { pts: [[0.215, 0.19], [0.22, 0.5], [0.232, 0.8], [0.238, 0.995]], w: 0.05 },
  { pts: [[0.23, 0.615], [0.4, 0.6], [BR.u, BR.v1 - 0.004], [0.66, 0.565], [0.8, 0.555], [0.875, 0.515]], w: 0.032 },
  { pts: [[0.29, 0.2], [0.42, 0.215], [BR.u, BR.v0 + 0.004], [0.64, 0.19], [0.74, 0.175], [0.8, 0.19]], w: 0.03 },
];
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; const t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1); return Math.hypot(px - ax - dx * t, py - ay - dy * t); }
function pathSDF(u, v) { let m = 9; for (const p of PATHS) for (let i = 0; i < p.pts.length - 1; i++) { const a = p.pts[i], b = p.pts[i + 1]; m = Math.min(m, segDist(u, v, a[0], a[1], b[0], b[1]) - p.w / 2); } return m; }
const BEDS = [
  { u0: 0.05, u1: 0.17, v0: 0.33, v1: 0.5, pal: 0 }, { u0: 0.05, u1: 0.17, v0: 0.55, v1: 0.72, pal: 1 }, { u0: 0.05, u1: 0.17, v0: 0.77, v1: 0.92, pal: 2 },
  { u0: 0.275, u1: 0.43, v0: 0.29, v1: 0.55, pal: 3 }, { u0: 0.275, u1: 0.43, v0: 0.67, v1: 0.92, pal: 1 },
];
function bedSDF(b, u, v) { const r = 0.016, cx = (b.u0 + b.u1) / 2, cy = (b.v0 + b.v1) / 2; const qx = Math.abs(u - cx) - ((b.u1 - b.u0) / 2 - r), qy = Math.abs(v - cy) - ((b.v1 - b.v0) / 2 - r); return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; }
// zones: 0 out, 1 lawn, 2 path, 3 bed, 4 water
function zoneAt(u, v) { if (rrSDF(u, v) > 0) return 0; if (pondSDF(u, v) < 0) return 4; for (const b of BEDS) if (bedSDF(b, u, v) < 0) return 3; if (pathSDF(u, v) < 0) return 2; return 1; }

// ---------------------------------------------------------------- sprite art (units: 1 = 1/1000 of the platform width; origin = ground contact)
const GREENS = ['#cfe58f', '#b3d86f', '#95c457', '#77ab45', '#5b8f3a', '#447433'];
const ART = {
  house(g, R) {
    const x0 = -78, x1 = 42, fh = 56, bx = 30, by = -15;
    let gr = g.createLinearGradient(x1, 0, x1 + bx, 0); gr.addColorStop(0, '#d18e88'); gr.addColorStop(1, '#bb7872');
    g.fillStyle = gr; poly(g, [[x1, 0], [x1 + bx, by], [x1 + bx, by - fh], [x1, -fh]]); g.fill();
    gr = g.createLinearGradient(x0, -fh, x1, 0); gr.addColorStop(0, '#f8c4bd'); gr.addColorStop(1, '#e49d97');
    g.fillStyle = gr; g.fillRect(x0, -fh, x1 - x0, fh);
    g.fillStyle = '#cdbba6'; g.fillRect(x0, -4, x1 - x0, 4); g.fillStyle = '#b5a38f'; poly(g, [[x1, 0], [x1 + bx, by], [x1 + bx, by - 4], [x1, -4]]); g.fill();
    // side window
    g.fillStyle = '#2f7d4f'; poly(g, [[x1 + 9, -30], [x1 + 21, -34], [x1 + 21, -48], [x1 + 9, -44]]); g.fill();
    g.fillStyle = '#5d7088'; poly(g, [[x1 + 11, -31.5], [x1 + 19, -34.2], [x1 + 19, -46], [x1 + 11, -43.4]]); g.fill();
    // windows + door
    const win = (cx, top, h) => {
      g.fillStyle = '#2f7d4f'; g.fillRect(cx - 10, top, 4.2, h); g.fillRect(cx + 5.8, top, 4.2, h);
      g.strokeStyle = 'rgba(20,60,35,.45)'; g.lineWidth = 0.5;
      for (let y = top + 2; y < top + h; y += 2) { g.beginPath(); g.moveTo(cx - 10, y); g.lineTo(cx - 5.8, y); g.moveTo(cx + 5.8, y); g.lineTo(cx + 10, y); g.stroke(); }
      g.fillStyle = '#fffaf0'; g.fillRect(cx - 5.4, top - 0.5, 10.8, h + 1);
      const gg = g.createLinearGradient(cx - 4, top, cx + 4, top + h); gg.addColorStop(0, '#94abc1'); gg.addColorStop(1, '#4f6580');
      g.fillStyle = gg; g.fillRect(cx - 4.2, top + 0.8, 8.4, h - 1.6);
      g.fillStyle = '#fffaf0'; g.fillRect(cx - 0.45, top + 0.8, 0.9, h - 1.6); g.fillRect(cx - 4.2, top + h * 0.42, 8.4, 0.8);
      // geranium box
      g.fillStyle = '#7a5a3c'; g.fillRect(cx - 5.6, top + h, 11.2, 2.2);
      for (let i = 0; i < 7; i++) sph(g, cx - 5 + R() * 10, top + h - 0.6 + R() * 1.4, 1.3 + R() * 0.6, R() < 0.7 ? '#e0453c' : '#5f9b45', 0.4, 0.25);
    };
    const n = 5, sp = (x1 - x0 - 26) / (n - 1);
    for (let row = 0; row < 2; row++) for (let i = 0; i < n; i++) {
      const cx = x0 + 13 + i * sp;
      if (row === 1 && i === 2) {
        g.fillStyle = '#fffaf0'; g.fillRect(cx - 6.5, -28.5, 13, 25);
        const dg = g.createLinearGradient(cx - 5, 0, cx + 5, 0); dg.addColorStop(0, '#3f9663'); dg.addColorStop(1, '#2a6e45');
        g.fillStyle = dg; g.fillRect(cx - 5.2, -27.5, 10.4, 23.5);
        g.fillStyle = '#e8d9b0'; g.beginPath(); g.arc(cx + 3, -15, 0.9, 0, 6.3); g.fill();
        g.fillStyle = '#d8cbb8'; g.fillRect(cx - 9, -4, 18, 2.5); g.fillStyle = '#c4b6a2'; g.fillRect(cx - 11, -1.6, 22, 1.8);
      } else win(cx, row ? -28 : -50, row ? 16 : 14);
    }
    // roof (hipped)
    const e = 5, rh = 30;
    const eL = [x0 - e, -fh + 1], eR = [x1 + e, -fh + 1], eBR = [x1 + bx + e, by - fh + 1], eBL = [x0 + bx - e, by - fh + 1];
    const P = [x0 + 22 + bx / 2, -fh - rh + by / 2], Q = [x1 - 14 + bx / 2, -fh - rh + by / 2];
    g.fillStyle = '#7c8699'; poly(g, [eL, P, eBL]); g.fill();
    g.fillStyle = '#6c768a'; poly(g, [eR, eBR, Q]); g.fill();
    gr = g.createLinearGradient(0, P[1], 0, eL[1]); gr.addColorStop(0, '#aab3c6'); gr.addColorStop(1, '#8691a7');
    g.fillStyle = gr; poly(g, [eL, eR, Q, P]); g.fill();
    g.strokeStyle = 'rgba(55,65,85,.28)'; g.lineWidth = 0.7;
    for (let i = 1; i < 7; i++) { const t = i / 7; g.beginPath(); g.moveTo(lerp(eL[0], P[0], t), lerp(eL[1], P[1], t)); g.lineTo(lerp(eR[0], Q[0], t), lerp(eR[1], Q[1], t)); g.stroke(); }
    g.strokeStyle = 'rgba(40,40,55,.35)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(eL[0], eL[1]); g.lineTo(eR[0], eR[1]); g.lineTo(eBR[0], eBR[1]); g.stroke();
    g.strokeStyle = '#c9d0de'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(P[0], P[1]); g.lineTo(Q[0], Q[1]); g.stroke();
    // dormers
    for (const dx of [-38, -8, 22]) {
      const cx = dx, by2 = -fh - 9;
      g.fillStyle = '#f2b7b0'; g.fillRect(cx - 5, by2 - 9, 10, 9);
      g.fillStyle = '#7c8699'; poly(g, [[cx - 7, by2 - 8], [cx + 7, by2 - 8], [cx, by2 - 15]]); g.fill();
      g.fillStyle = '#5d7088'; g.fillRect(cx - 3, by2 - 7, 6, 6.5); g.fillStyle = '#fffaf0'; g.fillRect(cx - 0.4, by2 - 7, 0.8, 6.5);
    }
    // chimneys
    for (const [cx, cy] of [[P[0] + 8, P[1]], [Q[0] - 10, Q[1]]]) {
      const cg = g.createLinearGradient(cx - 4, 0, cx + 4, 0); cg.addColorStop(0, '#dca08a'); cg.addColorStop(1, '#b77763');
      g.fillStyle = cg; g.fillRect(cx - 4, cy - 13, 8, 15); g.fillStyle = '#8e5a4a'; g.fillRect(cx - 5, cy - 14, 10, 2.5);
    }
    // climbing roses / ivy along the base and up the walls
    for (let x = x0 - 2; x < x1 + bx; x += 9) {
      const yb = x > x1 ? by * (x - x1) / bx : 0;
      if (Math.abs(x - (x0 + 13 + 2 * sp)) < 10) continue;
      bumpy(g, x, yb - 6, 7, 6, 9, GREENS.slice(1), 2.2, 3.6, R);
      for (let i = 0; i < 4; i++) sph(g, x - 5 + R() * 10, yb - 3 - R() * 9, 1.4, ['#f07aa0', '#e8506f', '#ffd0dc'][R() * 3 | 0], 0.45, 0.2);
    }
    for (const vx of [x0 + 2, x1 - 3]) for (let y = -10; y > -fh + 4; y -= 5) { sph(g, vx + (R() - 0.5) * 4, y, 2.2 + R(), GREENS[2 + (R() * 3 | 0)], 0.3, 0.2); if (R() < 0.4) sph(g, vx + (R() - 0.5) * 5, y - 2, 1.3, '#f07aa0', 0.4, 0.2); }
  },
  willow(g, R) {
    let gr = g.createLinearGradient(-10, 0, 10, 0); gr.addColorStop(0, '#9b7650'); gr.addColorStop(1, '#5e4630');
    g.fillStyle = gr; g.beginPath(); g.moveTo(-11, 0); g.quadraticCurveTo(-4, -50, -9, -105); g.lineTo(5, -108); g.quadraticCurveTo(4, -50, 11, 0); g.closePath(); g.fill();
    g.strokeStyle = '#6e5238'; g.lineCap = 'round';
    for (const [x, y, w] of [[-55, -140, 5], [48, -138, 5], [-20, -165, 4], [20, -160, 4]]) { g.lineWidth = w; g.beginPath(); g.moveTo(-2, -100); g.quadraticCurveTo(x * 0.4, -125, x, y); g.stroke(); }
    const strands = (n, cols, front) => {
      for (let i = 0; i < n; i++) {
        const x = (R() * 2 - 1) * 100, edge = Math.sqrt(Math.max(0, 1 - (x / 105) ** 2));
        const y0 = -155 + (front ? 30 : -10) * edge + R() * 20, len = 70 + R() * 70 * edge + 30;
        const curl = (x / 100) * (8 + R() * 10);
        for (let s = 0; s < len; s += 4.2) {
          const t = s / len, px = x + curl * t * t, py = y0 + s;
          if (py > -14) break;
          leaf(g, px, py, 7, 1.7, Math.PI / 2 + (R() - 0.5) * 0.7 + curl * 0.01, cols[clamp(Math.floor(R() * cols.length * (0.6 + t * 0.6)), 0, cols.length - 1)]);
        }
      }
    };
    strands(55, ['#88b350', '#6f9d42', '#5b8838', '#4b7531'], false);
    bumpy(g, 0, -160, 95, 48, 150, ['#d9eb9a', '#c2df7c', '#a6cf62', '#8abb50', '#6fa142', '#5a8a38'], 8, 14, R);
    strands(80, ['#e3f0a6', '#c8e284', '#acd36a', '#90c056', '#76a948'], true);
  },
  cherry(g, R) {
    let gr = g.createLinearGradient(-6, 0, 6, 0); gr.addColorStop(0, '#9a7254'); gr.addColorStop(1, '#5e4331');
    g.fillStyle = gr; g.beginPath(); g.moveTo(-7, 0); g.quadraticCurveTo(-2, -40, -6, -75); g.lineTo(5, -75); g.quadraticCurveTo(2, -40, 7, 0); g.fill();

let running = true;

const drawOrder = [];
const clouds = [{ x: 0.1, y: 0.16, s: 0.75, sp: 0.004, i: 0 }, { x: 0.55, y: 0.09, s: 0.6, sp: 0.003, i: 1 }, { x: 0.88, y: 0.2, s: 0.85, sp: 0.0035, i: 2 }, { x: 0.3, y: 0.82, s: 0.55, sp: 0.0025, i: 1 }, { x: 0.92, y: 0.6, s: 0.5, sp: 0.003, i: 0 }];

function isCircle(pts) {

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
